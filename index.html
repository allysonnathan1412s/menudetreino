<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Treino PPLUL • Visual + IA</title>
  <style>
    :root {
      --bg: #0b0e18;
      --surface: #151b2b;
      --card-stage: #1a2135;
      --card-footer: #2b3550;
      --card-footer-done: #1f4739;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue-accent: #60a5fa;
      --accent: #22c55e;
      --ai: #6366f1;
      --muscle: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
      line-height: 1.35;
      overflow-x: hidden;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 20px;
    }

    /* Top Minimal Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 2px 2px;
    }

    .topbar h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.15s;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.ai-btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: rgba(129, 140, 248, 0.5);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    /* Search Bar (toggleable) */
    .search-wrap {
      display: none;
      margin-bottom: 12px;
    }
    .search-wrap.open { display: block; }
    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
    }
    .search-input:focus { outline: none; border-color: var(--blue-accent); }

    /* Horizontal Day & Silhouette Strip */
    .day-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .day-strip::-webkit-scrollbar { display: none; }

    .day-tile {
      flex: 0 0 auto;
      min-width: 66px;
      background: var(--surface);
      border: 1.5px solid transparent;
      border-radius: 14px;
      padding: 8px 6px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: 0.18s;
    }

    .day-tile.active {
      border-color: #93c5fd;
      background: #1d263d;
      box-shadow: 0 0 0 1px rgba(147, 197, 253, 0.25);
    }

    .day-tile svg { width: 32px; height: 32px; }
    .day-tile .d-dow {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .day-tile.active .d-dow { color: #fff; }
    .day-tile .d-tag {
      font-size: 0.68rem;
      font-weight: 700;
      color: #cbd5e1;
    }
    .day-tile.rest .d-tag { color: #64748b; }

    /* Subtle Day Meta Line */
    .day-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 2px;
    }
    .day-meta-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #cbd5e1;
    }
    .day-meta-prog {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(34, 197, 94, 0.12);
      padding: 3px 9px;
      border-radius: 99px;
    }

    /* 2-Column Visual Grid (Reference Style) */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .ex-card {
      background: var(--card-stage);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.2s;
      position: relative;
    }

    .ex-card:active { transform: scale(0.97); }
    .ex-card.completed { border-color: rgba(34, 197, 94, 0.55); }

    .card-visual {
      position: relative;
      height: 156px;
      background: radial-gradient(circle at 50% 45%, #232d47 0%, #161c2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    .card-visual svg.human-svg {
      width: 144px;
      height: 144px;
    }

    .card-top-left {
      position: absolute;
      top: 9px;
      left: 9px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(11, 14, 24, 0.45);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      z-index: 3;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .ex-card.completed .card-top-left {
      background: var(--accent);
      color: #052e16;
    }

    .card-top-right {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(11, 14, 24, 0.45);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      z-index: 3;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .card-footer {
      background: var(--card-footer);
      padding: 11px 12px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
    }

    .ex-card.completed .card-footer {
      background: var(--card-footer-done);
    }

    .card-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-sub {
      font-size: 0.72rem;
      color: #cbd5e1;
      opacity: 0.85;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .card-reps-pill {
      font-weight: 700;
      color: #93c5fd;
    }
    .ex-card.completed .card-reps-pill { color: #86efac; }

    /* Rest Day View */
    .rest-view {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 46px 20px;
      text-align: center;
    }
    .rest-view h2 { font-size: 1.15rem; margin-bottom: 6px; }
    .rest-view p { font-size: 0.84rem; color: var(--muted); max-width: 300px; margin: 0 auto; }

    /* Bottom Compact Timer Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 14, 24, 0.94);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      z-index: 40;
    }

    .bottom-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .timer-val {
      font-variant-numeric: tabular-nums;
      font-size: 1.15rem;
      font-weight: 800;
      color: #93c5fd;
      min-width: 58px;
    }
    .timer-val.running { color: var(--accent); }

    .timer-btns { display: flex; gap: 6px; }
    .t-pill {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .t-pill.stop { color: #fca5a5; }

    /* Toast */
    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: #16a34a;
      color: #fff;
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Exercise Detail Bottom Sheet / Modal */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 12, 0.82);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .backdrop.open { display: flex; }

    .sheet {
      background: var(--surface);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid var(--border);
      border-bottom: none;
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(36px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 99px;
      margin: 10px auto 6px;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 18px 12px;
    }
    .sheet-head h2 { font-size: 1.08rem; font-weight: 800; }
    .sheet-head .sub { font-size: 0.76rem; color: #93c5fd; margin-top: 2px; }

    .close-x {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #232d47;
      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    .sheet-stage {
      background: radial-gradient(circle at 50% 45%, #24304d 0%, #141a2b 100%);
      height: 235px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 0 16px;
      border-radius: 18px;
      border: 1px solid var(--border);
    }

    .sheet-stage svg.human-svg { width: 225px; height: 225px; }

    .yt-float {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(220, 38, 38, 0.92);
      color: #fff;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sheet-body { padding: 14px 18px 24px; }

    .sheet-cue {
      font-size: 0.8rem;
      color: #cbd5e1;
      background: #1c243a;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .sets-hdr {
      display: grid;
      grid-template-columns: 40px 1fr 1fr 44px;
      gap: 8px;
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }

    .set-line {
      display: grid;
      grid-template-columns: 40px 1fr 1fr 44px;
      gap: 8px;
      align-items: center;
      padding: 5px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      margin-bottom: 6px;
    }
    .set-line.done { background: rgba(34, 197, 94, 0.14); }

    .set-idx { text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
    .set-inp {
      width: 100%;
      background: #0d1220;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 9px;
      padding: 8px 6px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
    }
    .set-inp:focus { outline: none; border-color: #60a5fa; }

    .set-chk {
      width: 36px;
      height: 36px;
      margin: 0 auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #232d47;
      color: transparent;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }
    .set-line.done .set-chk {
      background: var(--accent);
      border-color: var(--accent);
      color: #052e16;
    }

    /* AI Chat Sheet */
    .chat-sheet {
      background: var(--surface);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid var(--border);
      border-bottom: none;
      width: 100%;
      max-width: 540px;
      height: 86vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.2s ease-out;
    }

    .chat-key-bar {
      background: #101625;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.74rem;
    }
    .chat-key-row { display: flex; gap: 6px; margin-top: 6px; }
    .key-inp {
      flex: 1;
      background: #0b0e18;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 0.76rem;
    }
    .key-btn {
      background: var(--ai);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 7px 12px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; margin-right: 5px; }
    .dot.on { background: #22c55e; }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 86%;
      padding: 10px 13px;
      border-radius: 15px;
      font-size: 0.84rem;
      white-space: pre-wrap;
    }
    .bubble.ai { background: #222b42; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; }
    .bubble.user { background: var(--ai); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .upd-tag {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(34,197,94,0.18);
      color: #86efac;
    }

    .quick-row {
      display: flex;
      gap: 6px;
      padding: 0 14px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-row::-webkit-scrollbar { display: none; }
    .q-btn {
      flex-shrink: 0;
      background: #222b42;
      color: #cbd5e1;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 11px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .chat-send-bar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: #101625;
      border-top: 1px solid var(--border);
    }
    .chat-inp {
      flex: 1;
      background: #0b0e18;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.86rem;
    }
    .chat-go {
      background: var(--ai);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ================= REFERENCE-STYLE ANATOMICAL SVG ================= */
    .skin { fill: url(#iceBody); stroke: #172033; stroke-width: 1.2; stroke-linejoin: round; }
    .skin-dim { fill: url(#iceBodyDim); stroke: #172033; stroke-width: 1.2; stroke-linejoin: round; }
    .shorts { fill: #182032; stroke: #0b0e18; stroke-width: 1.1; }
    .shoe { fill: #334155; stroke: #0f172a; stroke-width: 1; }
    .eq-frame { fill: #dbeafe; stroke: #64748b; stroke-width: 1; opacity: 0.85; }
    .eq-pad { fill: #334155; stroke: #94a3b8; stroke-width: 1.2; }
    .eq-weight { fill: #93c5fd; stroke: #1e3a8a; stroke-width: 1.2; }
    .eq-cable { stroke: #cbd5e1; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; opacity: 0.7; }
    .m-glow {
      fill: url(#redMuscle);
      filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.8));
      animation: mPulse 2.2s ease-in-out infinite;
    }

    @keyframes mPulse { 0%,100% { opacity: 0.72; } 50% { opacity: 1; } }

    @keyframes k-incline { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-28px); } }
    @keyframes k-fly-l { 0%,100% { transform: rotate(-26deg); } 50% { transform: rotate(32deg); } }
    @keyframes k-fly-r { 0%,100% { transform: rotate(26deg); } 50% { transform: rotate(-32deg); } }
    @keyframes k-lat-l { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(76deg); } }
    @keyframes k-lat-r { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-76deg); } }
    @keyframes k-french { 0%,100% { transform: rotate(-105deg); } 50% { transform: rotate(4deg); } }
    @keyframes k-pulley { 0%,100% { transform: rotate(-70deg); } 50% { transform: rotate(12deg); } }
    @keyframes k-crunch { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(32deg); } }
    @keyframes k-pulldown { 0%,100% { transform: rotate(-66deg); } 50% { transform: rotate(14deg); } }
    @keyframes k-row { 0%,100% { transform: translateX(0px); } 50% { transform: translateX(-26px); } }
    @keyframes k-latpull { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(36px); } }
    @keyframes k-curl { 0%,100% { transform: rotate(16deg); } 50% { transform: rotate(-102deg); } }
    @keyframes k-squat { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(32px); } }
    @keyframes k-legcurl { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-90deg); } }
    @keyframes k-legext { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-78deg); } }
    @keyframes k-legpress { 0%,100% { transform: translate(0px, 0px); } 50% { transform: translate(22px, -22px); } }
    @keyframes k-calf { 0%,22%,100% { transform: translateY(0px); } 65% { transform: translateY(-19px); } }
    @keyframes k-add-l { 0%,100% { transform: rotate(22deg); } 50% { transform: rotate(2deg); } }
    @keyframes k-add-r { 0%,100% { transform: rotate(-22deg); } 50% { transform: rotate(-2deg); } }

    .a-incline { animation: k-incline 2.2s ease-in-out infinite; }
    .a-fly-l { transform-origin: 102px 92px; animation: k-fly-l 2.2s ease-in-out infinite; }
    .a-fly-r { transform-origin: 158px 92px; animation: k-fly-r 2.2s ease-in-out infinite; }
    .a-lat-l { transform-origin: 104px 86px; animation: k-lat-l 2.2s ease-in-out infinite; }
    .a-lat-r { transform-origin: 156px 86px; animation: k-lat-r 2.2s ease-in-out infinite; }
    .a-french { transform-origin: 130px 62px; animation: k-french 2.1s ease-in-out infinite; }
    .a-pulley { transform-origin: 128px 114px; animation: k-pulley 1.9s ease-in-out infinite; }
    .a-crunch { transform-origin: 120px 154px; animation: k-crunch 2.1s ease-in-out infinite; }
    .a-pulldown { transform-origin: 122px 86px; animation: k-pulldown 2.2s ease-in-out infinite; }
    .a-row { animation: k-row 2s ease-in-out infinite; }
    .a-latpull { animation: k-latpull 2.2s ease-in-out infinite; }
    .a-curl { transform-origin: 128px 114px; animation: k-curl 2.1s ease-in-out infinite; }
    .a-squat { animation: k-squat 2.4s ease-in-out infinite; }
    .a-legcurl { transform-origin: 158px 146px; animation: k-legcurl 2.1s ease-in-out infinite; }
    .a-legext { transform-origin: 146px 144px; animation: k-legext 2.1s ease-in-out infinite; }
    .a-legpress { animation: k-legpress 2.2s ease-in-out infinite; }
    .a-calf { animation: k-calf 2.3s ease-in-out infinite; }
    .a-add-l { transform-origin: 118px 124px; animation: k-add-l 2.1s ease-in-out infinite; }
    .a-add-r { transform-origin: 142px 124px; animation: k-add-r 2.1s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="toast" id="toast">Treino atualizado!</div>

  <div class="app">
    <!-- Minimalist Top Bar -->
    <header class="topbar">
      <h1>Exercícios</h1>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="toggleSearch()" title="Buscar exercício">🔍</button>
        <button class="icon-btn" onclick="resetDayChecks()" title="Limpar checks do dia">↺</button>
        <button class="icon-btn ai-btn" onclick="openChat()" title="Personal IA">✨</button>
      </div>
    </header>

    <!-- Toggleable Search -->
    <div class="search-wrap" id="searchWrap">
      <input type="text" id="searchInput" class="search-input" placeholder="Filtrar exercício..." oninput="renderGrid()" />
    </div>

    <!-- Horizontal Anatomical Day Strip -->
    <div class="day-strip" id="dayStrip"></div>

    <!-- Subtle Progress Line -->
    <div class="day-meta" id="dayMeta"></div>

    <!-- 2-Column Visual Grid -->
    <div id="gridContainer"></div>
  </div>

  <!-- Compact Rest Timer -->
  <div class="bottom-bar">

    function renderGrid() {
      const day = WORKOUTS[activeIdx];
      const meta = document.getElementById('dayMeta');
      const container = document.getElementById('gridContainer');

      if (day.rest) {
        meta.innerHTML = `<span class="day-meta-title">${day.title}</span>`;
        container.innerHTML = `
          <div class="rest-view">
            <div style="font-size:2.4rem;margin-bottom:10px;">🔋</div>
            <h2>${day.title}</h2>
            <p>Dia de recuperação muscular e articular. Hidrate-se bem e descanse para bater carga no próximo treino.</p>
          </div>
        `;
        return;
      }

      const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      let totalSets = 0, doneSets = 0;
      (day.exercises || []).forEach(ex => {
        for (let s = 0; s < ex.sets; s++) {
          totalSets++;
          if (getSetData(ex.id, s).done) doneSets++;
        }
      });

      meta.innerHTML = `
        <span class="day-meta-title">${day.title}</span>
        <span class="day-meta-prog">${doneSets}/${totalSets} séries</span>
      `;

      const filtered = (day.exercises || []).filter(ex =>
        !query || ex.name.toLowerCase().includes(query) || ex.muscle.toLowerCase().includes(query)
      );

      container.innerHTML = `<div class="grid">${filtered.map(ex => {
        let exDone = 0;
        for (let s = 0; s < ex.sets; s++) if (getSetData(ex.id, s).done) exDone++;
        const isDone = exDone === ex.sets;
        return `
          <div class="ex-card ${isDone ? 'completed' : ''}" onclick="openExSheet('${ex.id}')">
            <div class="card-visual">
              <div class="card-top-left">${isDone ? '✓' : `${exDone}/${ex.sets}`}</div>
              <div class="card-top-right">?</div>
              ${getHumanSVG(ex.anim)}
            </div>
            <div class="card-footer">
              <div class="card-name">${ex.name}</div>
              <div class="card-sub">
                <span>${ex.muscle}</span>
                <span class="card-reps-pill">${ex.sets}x ${ex.reps}</span>
              </div>
            </div>
          </div>
        `;
      }).join('')}</div>`;
    }

    function findExercise(exId) {
      for (const d of WORKOUTS) {
        if (d.exercises) {
          const f = d.exercises.find(e => e.id === exId);
          if (f) return f;
        }
      }
      return null;
    }

    function openExSheet(exId) {
      const ex = findExercise(exId);
      if (!ex) return;
      openExId = exId;
      document.getElementById('shTitle').textContent = ex.name;
      document.getElementById('shSub').textContent = `${ex.sets}x ${ex.reps} • ${ex.muscle}`;
      document.getElementById('shSvg').innerHTML = getHumanSVG(ex.anim);
      document.getElementById('shCue').textContent = ex.note || 'Execute com amplitude completa e controle excêntrico.';
      document.getElementById('shYt').href =
        'https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.name + ' execução correta academia');
      renderSheetSets(ex);
      document.getElementById('exBackdrop').classList.add('open');
    }

    function renderSheetSets(ex) {
      let html = '';
      for (let s = 0; s < ex.sets; s++) {
        const d = getSetData(ex.id, s);
        html += `
          <div class="set-line ${d.done ? 'done' : ''}">
            <div class="set-idx">${s + 1}ª</div>
            <input class="set-inp" type="number" inputmode="decimal" placeholder="kg" value="${d.kg}"
              oninput="updateField('${ex.id}', ${s}, 'kg', this.value)" />
            <input class="set-inp" type="text" inputmode="numeric" placeholder="${ex.reps}" value="${d.reps}"
              oninput="updateField('${ex.id}', ${s}, 'reps', this.value)" />
            <button class="set-chk" onclick="toggleSet('${ex.id}', ${s})">✓</button>
          </div>
        `;
      }
      document.getElementById('shSets').innerHTML = html;
    }

    function closeExSheet() {
      openExId = null;
      document.getElementById('exBackdrop').classList.remove('open');
    }

    function updateField(exId, s, field, val) {
      getSetData(exId, s)[field] = val;
      saveLogs();
    }

    function toggleSet(exId, s) {
      const d = getSetData(exId, s);
      d.done = !d.done;
      saveLogs();
      const ex = findExercise(exId);
      if (ex) renderSheetSets(ex);
      renderGrid();
    }

    function resetDayChecks() {
      const day = WORKOUTS[activeIdx];
      if (day.rest) return;
      day.exercises.forEach(ex => {
        for (let s = 0; s < ex.sets; s++) getSetData(ex.id, s).done = false;
      });
      saveLogs();
      renderGrid();
      showToast('Checks do dia limpos');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function inferAnim(name) {
      const n = name.toLowerCase();
      if (n.includes('panturrilha')) return 'calf_raise';
      if (n.includes('supino') || n.includes('desenvolvimento')) return 'incline_press';
      if (n.includes('crucifixo inverso') || n.includes('face pull')) return 'reverse_fly';
      if (n.includes('crucifixo') || n.includes('voador') || n.includes('crossover') || n.includes('peck')) return 'pec_fly';
      if (n.includes('elevação lateral') || n.includes('elevacao lateral')) return 'lateral_raise';
      if (n.includes('francês') || n.includes('frances') || n.includes('testa')) return 'tricep_french';
      if (n.includes('tríceps') || n.includes('triceps') || n.includes('corda') || n.includes('pulley')) return 'tricep_pulley';
      if (n.includes('abdômen') || n.includes('abdomen') || n.includes('abdominal')) return 'abs_crunch';
      if (n.includes('pulldown')) return 'pulldown';
      if (n.includes('puxada') || n.includes('barra fixa')) return 'lat_pulldown';
      if (n.includes('remada')) return 'row';
      if (n.includes('rosca') || n.includes('bíceps') || n.includes('biceps')) return 'bicep_curl';
      if (n.includes('agachamento') || n.includes('hack') || n.includes('smith')) return 'squat';
      if (n.includes('flexora') || n.includes('stiff')) return 'leg_curl';
      if (n.includes('extensora')) return 'leg_ext';
      if (n.includes('leg press')) return 'leg_press';
      if (n.includes('adutora') || n.includes('abdutora')) return 'hip_add';
      return 'squat';
    }

    function offlineAI(msg) {
      const lower = msg.toLowerCase();
      const swap = msg.match(/(?:troca|trocar|substitui|substituir|muda|mudar)\s+(?:o\s+|a\s+)?(.+?)\s+(?:por|para)\s+(.+)/i);
      if (swap) {
        const target = swap[1].trim().toLowerCase(), rep = swap[2].trim();
        let c = 0;
        WORKOUTS.forEach(d => (d.exercises || []).forEach(ex => {
          if (ex.name.toLowerCase().includes(target)) { ex.name = rep; ex.anim = inferAnim(rep); c++; }
        }));
        if (c) { saveWorkouts(); renderGrid(); showToast('Exercício atualizado!'); return { reply: `Troquei para "${rep}" na sua ficha.`, updated: true }; }
      }
      const setsM = msg.match(/(\d+)\s*(?:s[eé]ries|x)\s*(?:no|na|em|para)?\s*(.+)/i);
      if (setsM && !lower.includes('adiciona')) {
        const n = Math.max(1, Math.min(8, parseInt(setsM[1], 10))), target = setsM[2].trim().toLowerCase();
        let c = 0;
        WORKOUTS.forEach(d => (d.exercises || []).forEach(ex => {
          if (ex.name.toLowerCase().includes(target)) { ex.sets = n; c++; }
        }));
        if (c) { saveWorkouts(); renderGrid(); showToast('Séries atualizadas!'); return { reply: `Atualizei para ${n} séries.`, updated: true }; }
      }
      const rem = msg.match(/(?:tira|tirar|remove|remover|apaga|apagar)\s+(?:o\s+|a\s+)?(.+)/i);
      if (rem) {
        const target = rem[1].trim().toLowerCase();
        let c = 0;
        WORKOUTS.forEach(d => {
          if (d.exercises) {
            const b = d.exercises.length;
            d.exercises = d.exercises.filter(ex => !ex.name.toLowerCase().includes(target));
            c += b - d.exercises.length;
          }
        });
        if (c) { saveWorkouts(); renderGrid(); showToast('Exercício removido!'); return { reply: `Removi "${rem[1].trim()}" da ficha.`, updated: true }; }
      }
      if (lower.includes('descanso')) {
        return { reply: 'Compostos pesados (Supino, Remada, Agachamento, Leg Press): 2m30 a 3m. Isoladores e panturrilha: 1m30 a 2m.', updated: false };
      }
      return {
        reply: 'No modo offline entendo comandos como "Troca X por Y", "Coloca 4 séries no X" ou "Remove X". Para IA completa, conecte sua chave gratuita do Gemini ali em cima.',
        updated: false
      };
    }

    async function callGemini(userMsg) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
      const prompt = `Você é um Personal Trainer integrado a um app de treino PPLUL.
Ficha atual em JSON: ${JSON.stringify(WORKOUTS)}
Valores válidos de "anim": pec_fly, incline_press, lateral_raise, tricep_french, tricep_pulley, abs_crunch, pulldown, row, lat_pulldown, reverse_fly, bicep_curl, squat, leg_curl, leg_ext, leg_press, hip_add, calf_raise.
Responda em PT-BR retornando APENAS JSON válido:
{"reply": "texto", "updatedWorkouts": null}
Se o usuário pedir alteração na ficha, retorne o array completo de 7 dias em "updatedWorkouts". Caso contrário, deixe null.
Usuário: ${userMsg}`;

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: 'application/json', temperature: 0.4 }
        })
      });
      if (!res.ok) throw new Error('Erro ' + res.status);
      const data = await res.json();
      const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
      return JSON.parse(raw.replace(/```json|```/g, '').trim());
    }

    async function sendChat() {
      const inp = document.getElementById('chatInput');
      const btn = document.getElementById('chatGoBtn');
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';
      chatHistory.push({ role: 'user', text });
      renderChat();
      btn.disabled = true; btn.textContent = '...';

      try {
        if (apiKey) {
          const r = await callGemini(text);
          let upd = false;
          if (Array.isArray(r.updatedWorkouts) && r.updatedWorkouts.length === 7) {
            WORKOUTS = r.updatedWorkouts;
            saveWorkouts(); renderDayStrip(); renderGrid();
            upd = true; showToast('Treino atualizado pela IA!');
          }
          chatHistory.push({ role: 'ai', text: r.reply || 'Pronto!', updated: upd });
        } else {
          const r = offlineAI(text);
          chatHistory.push({ role: 'ai', text: r.reply, updated: r.updated });
        }
      } catch (e) {
        chatHistory.push({ role: 'ai', text: 'Erro ao conectar com a API (' + e.message + ').' });
      } finally {
        btn.disabled = false; btn.textContent = 'Enviar';
        renderChat();
      }
    }

    // ================= REST TIMER =================
    let tInt = null, rem = 0;
    function fmt(s) { return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.2; o.start();
        setTimeout(() => { o.stop(); ctx.close(); }, 280);
      } catch(e) {}
    }
    function startTimer(sec) {
      clearInterval(tInt); rem = sec;
      const d = document.getElementById('timerDisplay');
      d.classList.add('running'); d.textContent = fmt(rem);
      tInt = setInterval(() => {
        rem--; d.textContent = fmt(Math.max(0, rem));
        if (rem <= 0) { clearInterval(tInt); d.classList.remove('running'); beep(); }
      }, 1000);
    }
    function stopTimer() {
      clearInterval(tInt); rem = 0;
      const d = document.getElementById('timerDisplay');
      d.classList.remove('running'); d.textContent = '00:00';
    }

    renderDayStrip();
    renderGrid();
  </script>
</body>
</html>
